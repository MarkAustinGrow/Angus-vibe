version: "3"

services:
  angus:
    build: .
    restart: always
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: python angus.py --daemon

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: always
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./templates:/app/templates
    env_file:
      - .env
    ports:
      - "8080:5000"

  angus-coral:
    build: .
    restart: always
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - CORAL_SERVER_URL=http://coral.pushcollective.club:3001
      - AGENT_ID=did:web:angus.ai
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: python run_angus_coral.py --daemon
